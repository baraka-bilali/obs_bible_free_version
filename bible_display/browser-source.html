<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Display - OBS Browser Source</title>
    <link rel="stylesheet" href="../common/css/style-source.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="../common/js/jquery.js"></script>
    <script src="../common/js/bible-fonts.js"></script>
</head>
<body>
    <div id="obsCanvas">
        <div class="bible-display-container">
            <div class="verse-display hidden" id="verseDisplay">
                <div class="verse-bg" id="verseBg"></div>
                <div class="verse-content" id="verseContent">
                    <h2 class="verse-reference" id="verseReference"></h2>
                    <p class="verse-text" id="verseText"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const OBS_DESIGN_WIDTH = 1920;
        const OBS_DESIGN_HEIGHT = 1080;

        function updateObsCanvasScale() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const canvas = document.getElementById('obsCanvas');

            // Uniform scale (never stretch text). Width drives the scale so the
            // overlay fills the browser source horizontally at any 16:9 size.
            const scale = w / OBS_DESIGN_WIDTH;
            canvas.style.transform = 'scale(' + scale + ')';

            // If the source is not 16:9, fit entirely without deformation.
            const scaledH = OBS_DESIGN_HEIGHT * scale;
            if (scaledH > h + 1) {
                const fitScale = h / OBS_DESIGN_HEIGHT;
                canvas.style.transform = 'scale(' + fitScale + ')';
            }
        }

        window.addEventListener('resize', function() {
            updateObsCanvasScale();
            applySettings();
        });
        updateObsCanvasScale();
        let lastReference = '';
        let lastText = '';
        let autoHideTimeout = null;
        let isDisplayVisible = false; // Track whether the block is currently showing

        // When verses are split into slides, only a light shrink is needed.
        // When the whole verse stays on one slide, prefer the chosen font size
        // and stretch the banner instead of shrinking the text.
        const MIN_READABLE_FONT_SPLIT = 14;

        function getMinReadableFontSize(baseFontSize, splitEnabled) {
            if (splitEnabled) {
                // Light shrink only: never below 85% of chosen size, floor 14px
                return Math.max(MIN_READABLE_FONT_SPLIT, Math.round(baseFontSize * 0.85));
            }
            // Whole-verse mode: do not shrink — banner stretches instead.
            return baseFontSize;
        }

        function getVerseLineCount(element) {
            const style = window.getComputedStyle(element);
            const lineHeightPx = parseFloat(style.lineHeight);
            if (!lineHeightPx) return 1;

            // scrollHeight includes padding — exclude it so line count stays accurate
            const paddingTop = parseFloat(style.paddingTop) || 0;
            const paddingBottom = parseFloat(style.paddingBottom) || 0;
            const contentHeight = element.scrollHeight - paddingTop - paddingBottom;

            return Math.max(1, Math.round(contentHeight / lineHeightPx));
        }

        function resetVerseTextLayout() {
            $('#verseText').css({
                'display': 'block',
                '-webkit-line-clamp': 'unset',
                '-webkit-box-orient': 'unset',
                'flex-direction': '',
                'justify-content': '',
                'overflow': 'visible',
                'text-overflow': 'clip',
                'min-height': '',
                'height': '',
                'box-sizing': ''
            });
        }

        function fitVerseTextToMaxLines() {
            const maxLinesSetting = parseInt(localStorage.getItem('bibleMaxLines') || '0', 10);
            const theme = localStorage.getItem('bibleTheme') || 'classic-dark';
            // Some themes get a small verse-text size boost.
            const verseScale = (theme === 'elegant-quote') ? 1.12 : 1;
            const baseFontSize = Math.round(parseInt(localStorage.getItem('bibleVerseFontSize') || '18', 10) * verseScale);
            const lineHeight = localStorage.getItem('bibleLineHeight') || '1.6';
            const splitEnabled = localStorage.getItem('bibleSplitVerses') === 'true';
            const verseTextEl = document.getElementById('verseText');
            const minFontSize = getMinReadableFontSize(baseFontSize, splitEnabled);
            const configuredLH = parseFloat(lineHeight) || 1.6;

            // Elegant Quote always uses a reserved block height (default 3 lines).
            const isElegantQuote = (theme === 'elegant-quote');
            const maxLines = isElegantQuote
                ? (maxLinesSetting > 0 ? maxLinesSetting : 3)
                : maxLinesSetting;

            resetVerseTextLayout();
            $('#verseContent').css('min-height', '');
            verseTextEl.style.lineHeight = lineHeight;
            verseTextEl.style.setProperty('font-size', baseFontSize + 'px', 'important');

            if (!verseTextEl.textContent.trim()) {
                return;
            }

            // No line limit (non elegant): use chosen size, natural banner height.
            if (!isElegantQuote && maxLines <= 0) {
                return;
            }

            let bestFit = baseFontSize;
            let actualLines = getVerseLineCount(verseTextEl);

            // Split mode only: gently shrink so each slide fits maxLines.
            // Whole-verse mode: keep the chosen size and stretch the banner.
            if (splitEnabled && actualLines > maxLines) {
                let low = minFontSize;
                let high = baseFontSize - 1;
                bestFit = minFontSize;

                while (low <= high) {
                    const mid = Math.floor((low + high) / 2);
                    verseTextEl.style.setProperty('font-size', mid + 'px', 'important');
                    const lines = getVerseLineCount(verseTextEl);

                    if (lines <= maxLines) {
                        bestFit = mid;
                        low = mid + 1;
                    } else {
                        high = mid - 1;
                    }
                }

                verseTextEl.style.setProperty('font-size', bestFit + 'px', 'important');
                actualLines = getVerseLineCount(verseTextEl);
            }

            // Banner height follows the chosen font size and grows with content.
            // With a max-lines setting, keep at least that many lines of height
            // for short verses, and stretch further when the verse needs more.
            const linesForBanner = splitEnabled
                ? maxLines
                : Math.max(actualLines, maxLines > 0 ? maxLines : 1);
            const reservedHeight = Math.ceil(baseFontSize * configuredLH * linesForBanner);

            const css = {
                'height': reservedHeight + 'px',
                'min-height': reservedHeight + 'px',
                'box-sizing': 'content-box',
                'overflow': 'hidden'
            };

            const stillTooLong = getVerseLineCount(verseTextEl) > linesForBanner;

            if (stillTooLong && splitEnabled) {
                css['display'] = '-webkit-box';
                css['-webkit-line-clamp'] = maxLines.toString();
                css['-webkit-box-orient'] = 'vertical';
                css['text-overflow'] = 'ellipsis';
            } else if (isElegantQuote) {
                verseTextEl.style.lineHeight = lineHeight;
                css['display'] = 'flex';
                css['flex-direction'] = 'column';
                css['justify-content'] = 'center';
            } else {
                // Keep natural line-height so large fonts stay visually large.
                verseTextEl.style.lineHeight = lineHeight;
                css['display'] = 'flex';
                css['flex-direction'] = 'column';
                css['justify-content'] = actualLines < linesForBanner ? 'center' : 'flex-start';
                css['overflow'] = 'visible';
            }

            $('#verseText').css(css);

            // Elegant Quote: lock overlay height (padding + text + reference).
            if (isElegantQuote) {
                const refFontSize = parseInt(localStorage.getItem('bibleRefFontSize') || '20', 10);
                const refBlock = Math.round(refFontSize * 1.3) + 12;
                const contentMinHeight = 10 + 14 + reservedHeight + refBlock;
                $('#verseContent').css('min-height', contentMinHeight + 'px');
            } else {
                // Let the whole banner stretch with large fonts / long verses.
                const refEl = document.getElementById('verseReference');
                const refH = refEl ? refEl.offsetHeight : 0;
                const contentPad = 8;
                $('#verseContent').css('min-height', (reservedHeight + refH + contentPad) + 'px');
            }
        }

        function clearPanelBackgroundOverrides() {
            // Always use theme colors for the panel background.
            $('#verseBg, #verseContent').css({
                'background': '',
                'background-image': '',
                'background-color': ''
            });
        }

        function applySettings() {
            const refFontSize = localStorage.getItem('bibleRefFontSize') || '20';
            const verseFontSize = localStorage.getItem('bibleVerseFontSize') || '18';
            const lineHeight = localStorage.getItem('bibleLineHeight') || '1.6';
            const alignment = localStorage.getItem('bibleAlignment') || 'center';
            const theme = localStorage.getItem('bibleTheme') || 'classic-dark';
            const opacity = localStorage.getItem('bibleOpacity') || '100';
            const opacityTarget = localStorage.getItem('bibleOpacityTarget') || 'global';

            // Font sizes (independent). Some themes get a small size boost.
            // Use setProperty so theme CSS cannot override the chosen size.
            const refScale = (theme === 'elegant-quote') ? 1.3 : 1;
            const verseScale = (theme === 'elegant-quote') ? 1.12 : 1;
            document.getElementById('verseReference').style.setProperty(
                'font-size',
                Math.round(parseFloat(refFontSize) * refScale) + 'px',
                'important'
            );
            document.getElementById('verseText').style.setProperty(
                'font-size',
                Math.round(parseFloat(verseFontSize) * verseScale) + 'px',
                'important'
            );

            // Font families
            const refFontFamily = localStorage.getItem('bibleRefFontFamily') || 'theme';
            const verseFontFamily = localStorage.getItem('bibleVerseFontFamily') || 'theme';
            const refStack = getBibleFontStack(refFontFamily);
            const verseStack = getBibleFontStack(verseFontFamily);
            $('#verseReference').css('font-family', refStack || '');
            $('#verseText').css('font-family', verseStack || '');

            // Line spacing
            $('#verseText').css('line-height', lineHeight);

            // Alignment
            $('#verseDisplay').css('text-align', alignment);

            // Elegant Quote: make the reference (title) follow the alignment too,
            // like the verse text does in other themes.
            if (theme === 'elegant-quote') {
                const alignMap = { left: 'flex-start', center: 'center', right: 'flex-end' };
                const alignItems = alignMap[alignment] || 'flex-start';
                $('#verseContent').css('align-items', alignItems);
                $('#verseReference').css({
                    'align-self': alignItems,
                    'padding-left': alignment === 'left' ? '29px' : '0',
                    'padding-right': alignment === 'right' ? '2px' : '0'
                });
            } else {
                $('#verseContent').css('align-items', '');
                $('#verseReference').css({
                    'align-self': '',
                    'padding-left': '',
                    'padding-right': ''
                });
            }

            // Opacity (3 modes)
            const opVal = parseFloat(opacity) / 100;
            const panelBgLayer = '#verseBg';
            if (opacityTarget === 'background') {
                $('#verseDisplay').css('opacity', 1);
                $(panelBgLayer).css('opacity', opVal);
                if (panelBgLayer === '#verseContent') {
                    $('#verseBg').css('opacity', 1);
                } else {
                    $('#verseContent').css('opacity', 1);
                }
            } else if (opacityTarget === 'text') {
                // Only text affected
                $('#verseDisplay').css('opacity', 1);
                $('#verseBg').css('opacity', 1);
                $('#verseContent').css('opacity', opVal);
            } else {
                // Global (whole block)
                $('#verseDisplay').css('opacity', opVal);
                $('#verseBg').css('opacity', 1);
                $('#verseContent').css('opacity', 1);
            }

            // Theme
            $('body').attr('data-theme', theme);

            // Reset any previous custom panel background overrides (themes own the colors)
            clearPanelBackgroundOverrides();

            // Text styles — verse
            let verseWeight = localStorage.getItem('bibleVerseFontWeight');
            if (verseWeight === null && localStorage.getItem('bibleBold') === 'true') {
                verseWeight = '700';
            }
            const verseItalic = localStorage.getItem('bibleVerseItalic') === 'true';
            const verseUnderline = localStorage.getItem('bibleVerseUnderline') === 'true';
            const verseLetterSpacing = parseFloat(localStorage.getItem('bibleVerseLetterSpacing') || '0');
            $('#verseText').css({
                'font-weight': verseWeight || '',
                'font-style': verseItalic ? 'italic' : '',
                'text-decoration': verseUnderline ? 'underline' : '',
                'letter-spacing': verseLetterSpacing > 0 ? verseLetterSpacing + 'px' : ''
            });

            // Text styles — reference
            const refWeight = localStorage.getItem('bibleRefFontWeight') || '';
            const refItalic = localStorage.getItem('bibleRefItalic') === 'true';
            const refLetterSpacing = parseFloat(localStorage.getItem('bibleRefLetterSpacing') || '0');
            $('#verseReference').css({
                'font-weight': refWeight || '',
                'font-style': refItalic ? 'italic' : '',
                'letter-spacing': refLetterSpacing > 0 ? refLetterSpacing + 'px' : ''
            });

            // Capitalization (verse only)
            const capitalization = localStorage.getItem('bibleCapitalization') || 'none';
            $('#verseText').css('text-transform', capitalization !== 'none' ? capitalization : '');

            // Shrink verse text to fit within the configured line limit
            fitVerseTextToMaxLines();
        }

        function hideVerse() {
            if (!isDisplayVisible) return;

            // Get transition type for exit animation
            const transition = localStorage.getItem('bibleTransition') || 'fade';
            
            // Remove all entrance classes, add exit class
            $('#verseDisplay').removeClass('fade fade-in slide-up slide-down slide-left zoom none');
            $('#verseDisplay').addClass(transition + '-out');
            
            // Wait for exit animation to finish, then hide
            const exitDuration = (transition === 'none') ? 300 : 550;
            setTimeout(function() {
                $('#verseReference').text('');
                $('#verseText').text('');
                $('#verseDisplay').removeClass(transition + '-out');
                $('#verseDisplay').addClass('hidden');
                lastReference = '';
                lastText = '';
                isDisplayVisible = false;
            }, exitDuration);
        }

        function updateVerseDisplay() {
            const reference = localStorage.getItem('currentVerseReference') || '';
            const text = localStorage.getItem('currentVerseText') || '';
            const source = localStorage.getItem('currentVerseSource') || '';

            // Check if verse was cleared (deselected)
            if (!reference && !text && (lastReference || lastText)) {
                hideVerse();
                return;
            }

            // Only update if something changed
            if (reference === lastReference && text === lastText) {
                // Still apply settings in case they changed
                applySettings();
                return;
            }

            lastReference = reference;
            lastText = text;

            // Clear any existing auto-hide timer
            if (autoHideTimeout) {
                clearTimeout(autoHideTimeout);
                autoHideTimeout = null;
            }

            if (reference && text) {
                // Is this the first verse appearing (hidden → visible)?
                const isEntrance = !isDisplayVisible;

                // Show the block if it was hidden
                $('#verseDisplay').removeClass('hidden');
                
                // Extract abbreviation from parentheses (e.g. "Louis Segond (LSG)" → "LSG")
                const parenMatch = source.match(/\(([^)]+)\)/);
                const abbr = source ? ' (' + (parenMatch ? parenMatch[1].toUpperCase() : source.substring(0, 3).toUpperCase()) + ')' : '';
                $('#verseReference').text(reference + abbr);
                $('#verseText').text(text);

                // Entrance transition ONLY when going from nothing → first verse
                // Switching between verses = instant update, no animation
                if (isEntrance) {
                    const transition = localStorage.getItem('bibleTransition') || 'fade';
                    $('#verseDisplay').removeClass('fade fade-in slide-up slide-down slide-left zoom none fade-out slide-up-out slide-down-out slide-left-out zoom-out none-out');
                    void document.getElementById('verseDisplay').offsetWidth;
                    $('#verseDisplay').addClass(transition);
                }

                isDisplayVisible = true;

                // Auto-hide if enabled
                const autoHide = localStorage.getItem('bibleAutoHide') === 'true';
                if (autoHide) {
                    const timer = parseInt(localStorage.getItem('bibleAutoHideTimer') || '5') * 1000;
                    autoHideTimeout = setTimeout(hideVerse, timer);
                }
            }

            applySettings();
        }

        // Listen for storage events (from control panel)
        window.addEventListener('storage', function(e) {
            if (['currentVerseReference', 'currentVerseText', 'currentVerseSource',
                 'bibleRefFontSize', 'bibleVerseFontSize', 'bibleRefFontFamily', 'bibleVerseFontFamily', 'bibleLineHeight', 'bibleAlignment', 'bibleTheme',
                 'bibleOpacity', 'bibleOpacityTarget', 'bibleSettingsTick', 'bibleMaxLines', 'bibleSplitVerses', 'bibleTransition', 'bibleAutoHide', 'bibleAutoHideTimer',
                 'bibleBold', 'bibleVerseFontWeight', 'bibleVerseItalic', 'bibleVerseUnderline', 'bibleVerseLetterSpacing',
                 'bibleRefFontWeight', 'bibleRefItalic', 'bibleRefLetterSpacing', 'bibleCapitalization'].includes(e.key)) {
                updateVerseDisplay();
            }
        });

        // Poll as fallback (same-tab localStorage doesn't fire storage event)
        setInterval(updateVerseDisplay, 1000);

        // Initial: clear any leftover verse from a previous session
        // so the display stays hidden until the user explicitly shows a verse
        localStorage.removeItem('currentVerseReference');
        localStorage.removeItem('currentVerseText');
        localStorage.removeItem('currentVerseSource');
        lastReference = '';
        lastText = '';
        isDisplayVisible = false;
        applySettings();
    </script>
</body>
</html>
